name: Demo1 Excel to Markdown

on:
  push:
    paths:
      - 'sap/btp/demo1/documents/*.xlsx'
      - 'sap/btp/demo1/documents/script/demo_exceltomd.py'
      - '.github/workflows/demo1-excel-to-md.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excel-to-md:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Check for XLSX files
        id: check_xlsx
        shell: bash
        run: |
          shopt -s nullglob
          files=(sap/btp/demo1/documents/*.xlsx)
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_xlsx=false" >> "$GITHUB_OUTPUT"
            echo "No XLSX files found."
          else
            echo "has_xlsx=true" >> "$GITHUB_OUTPUT"
            printf 'Found XLSX: %s\n' "${files[@]}"
          fi

      - name: Convert XLSX to Markdown
        if: steps.check_xlsx.outputs.has_xlsx == 'true'
        run: python sap/btp/demo1/documents/script/demo_exceltomd.py

      - name: Commit generated documents
        if: steps.check_xlsx.outputs.has_xlsx == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sap/btp/demo1/documents
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: convert demo1 Excel document to Markdown"
            git push
          fi

      # The workflow is intentionally scoped to the demo1 documents folder.
