name: Check README

on:
  push:
    paths:
      - '**/README.md'
  pull_request:
    paths:
      - '**/README.md'

permissions:
  contents: read
  issues: write

jobs:
  check-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Find changed README files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          fi

          echo "Changed README files:"
          cat changed_readmes.txt || true

      - name: Validate README files and create issues on failure
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -s changed_readmes.txt ]; then
            echo "No README.md files changed."
            exit 0
          fi

          validation_failed=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "Checking $file"

            if output=$(python sap/abap/documents/script/check_readme.py "$file" 2>&1); then
              echo "$output"
              continue
            fi

            validation_failed=1
            echo "$output"

            issue_title="README validation failed: $file"
            issue_body=$(printf '## 任务\n修正 `%s` 的 README 格式，使其通过 README 自动检查。\n\n## 要求\n- README 必须符合对应的 `sap/abap/documents/template/` 模板和 `check_readme.py` 验证规则。\n- 自动检查失败信息如下：\n\n```\n%s\n```\n\n## 验收条件\n- [ ] 修正 `%s` 中导致检查失败的内容。\n- [ ] `%s` 通过 `sap/abap/documents/script/check_readme.py` 检查。\n' "$file" "$output" "$file" "$file")

            existing_issue=$(gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --json number,title \
              --jq ".[] | select(.title == \"$issue_title\") | .number" | head -n 1)

            if [ -n "$existing_issue" ]; then
              echo "Updating existing Issue #$existing_issue"
              gh issue edit "$existing_issue" --repo "$GH_REPO" --body "$issue_body"
            else
              echo "Creating Issue: $issue_title"
              gh issue create --repo "$GH_REPO" --title "$issue_title" --body "$issue_body"
            fi
          done < changed_readmes.txt

          if [ "$validation_failed" -ne 0 ]; then
            exit 1
          fi
