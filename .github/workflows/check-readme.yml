name: Check README

on:
  push:
    paths:
      - '**/README.md'
  pull_request:
    paths:
      - '**/README.md'

permissions:
  contents: read
  issues: write

jobs:
  check-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Find changed README files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          fi

          echo "Changed README files:"
          cat changed_readmes.txt || true

      - name: Validate README files and manage issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -s changed_readmes.txt ]; then
            echo "No README.md files changed."
            exit 0
          fi

          validation_failed=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            check_status=0

            echo "Checking $file"
            output=$(python sap/abap/documents/script/check_readme.py "$file" 2>&1) || check_status=$?
            printf '%s\n' "$output"

            sync_lines=$(printf '%s\n' "$output" | grep '^LIST_SYNC_REQUIRED: ' || true)
            if [ -n "$sync_lines" ]; then
              while IFS= read -r sync_line; do
                [ -z "$sync_line" ] && continue

                payload=${sync_line#LIST_SYNC_REQUIRED: }
                list_file=${payload%%|*}
                details=${payload#*|}
                missing=${details#missing=}
                missing=${missing%%|extra=*}
                extra=${details#*|extra=}

                issue_title="更新 List README：$list_file"
                existing_issue=$(gh issue list \
                  --repo "$GH_REPO" \
                  --state open \
                  --search "in:title $issue_title" \
                  --json number,title \
                  --jq ".[] | select(.title == \"$issue_title\") | .number" | head -n 1)

                list_link="https://github.com/$GH_REPO/blob/main/$list_file"
                requirements="- [$list_file]($list_link) 必须与当前实际子文件夹保持同步。"
                if [ -n "$missing" ]; then
                  requirements="${requirements}"$'\n'"- 当前实际存在但未列出的子文件夹：$missing。"
                fi
                if [ -n "$extra" ]; then
                  requirements="${requirements}"$'\n'"- List README 中存在但当前实际不存在的子文件夹：$extra。"
                fi

                issue_body=$(printf '## 任务\n更新 [%s](%s)，使其与当前实际子文件夹保持同步。\n\n## 要求\n%s\n- 按 sap/abap/documents/skill.md 和 sap/abap/documents/template/list.md 的规则维护 List README。\n- 更新后必须通过 sap/abap/documents/script/check_readme.py 自动检查。\n\n## 验收条件\n- [ ] [%s](%s) 已与实际子文件夹同步，并通过 README 自动检查。\n' "$list_file" "$list_link" "$requirements" "$list_file" "$list_link")

                if [ -n "$existing_issue" ]; then
                  echo "Updating existing List README synchronization Issue #$existing_issue"
                  gh issue edit "$existing_issue" --repo "$GH_REPO" --body "$issue_body"
                  # Unfinished Issue must never have review.
                  gh issue edit "$existing_issue" --repo "$GH_REPO" --remove-label review || true
                else
                  echo "Creating List README synchronization Issue: $issue_title"
                  # Do not add review. The acceptance checkbox is still unchecked.
                  gh issue create --repo "$GH_REPO" --title "$issue_title" --body "$issue_body"
                fi
              done <<< "$sync_lines"

              validation_failed=1
            fi

            if [ "$check_status" -eq 0 ]; then
              issue_title="README validation failed: $file"
              existing_issue=$(gh issue list \
                --repo "$GH_REPO" \
                --state open \
                --search "in:title $issue_title" \
                --json number,title \
                --jq ".[] | select(.title == \"$issue_title\") | .number" | head -n 1)

              if [ -n "$existing_issue" ]; then
                echo "README validation passed. Updating existing Issue #$existing_issue"

                issue_body=$(gh issue view "$existing_issue" \
                  --repo "$GH_REPO" \
                  --json body \
                  --jq '.body')

                issue_body=$(printf '%s\n' "$issue_body" | \
                  sed -E 's#^- \[ \] (.*) 通过 `sap\/abap\/documents\/script\/check_readme\.py` 检查。$#- [x] \1 通过 `sap/abap/documents/script/check_readme.py` 检查。#')

                gh issue edit "$existing_issue" --repo "$GH_REPO" --body "$issue_body"

                # review is added only after the acceptance checkbox is [x].
                gh label create review --repo "$GH_REPO" --force --color 0366d6 --description "README review required"
                gh issue edit "$existing_issue" --repo "$GH_REPO" --add-label review
              fi

              continue
            fi

            non_sync_errors=$(printf '%s\n' "$output" | grep -F '❌ FAIL' | grep -v -E 'List README|README 自动检查未通过' || true)
            if [ -z "$non_sync_errors" ]; then
              continue
            fi

            validation_failed=1
            issue_title="README validation failed: $file"
            existing_issue=$(gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --search "in:title $issue_title" \
              --json number,title \
              --jq ".[] | select(.title == \"$issue_title\") | .number" | head -n 1)

            errors="$non_sync_errors"
            file_link="https://github.com/$GH_REPO/blob/main/$file"
            issue_body=$(printf '## 任务\n修正 [%s](%s) 的 README 格式，使其通过 README 自动检查。\n\n## 要求\n### 自动检查失败信息：\n\n%s\n\n## 验收条件\n- [ ] [%s](%s) 通过 `sap/abap/documents/script/check_readme.py` 检查。\n' "$file" "$file_link" "$errors" "$file" "$file_link")

            if [ -n "$existing_issue" ]; then
              echo "Updating existing Issue #$existing_issue"
              gh issue edit "$existing_issue" --repo "$GH_REPO" --body "$issue_body"
              # Validation is not complete, so review must be absent.
              gh issue edit "$existing_issue" --repo "$GH_REPO" --remove-label review || true
            else
              echo "Creating Issue: $issue_title"
              gh issue create --repo "$GH_REPO" --title "$issue_title" --body "$issue_body"
            fi
          done < changed_readmes.txt

          if [ "$validation_failed" -ne 0 ]; then
            exit 1
          fi
