name: Check README

on:
  push:
    paths:
      - '**/README.md'
  pull_request:
    paths:
      - '**/README.md'

permissions:
  contents: read
  issues: write

jobs:
  check-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Find changed README files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '**/README.md' > changed_readmes.txt
          fi

          echo "Changed README files:"
          cat changed_readmes.txt || true

      - name: Validate README files and manage issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -s changed_readmes.txt ]; then
            echo "No README.md files changed."
            exit 0
          fi

          validation_failed=0

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            echo "Checking $file"

            issue_title="README validation failed: $file"
            existing_issue=$(gh issue list \
              --repo "$GH_REPO" \
              --state open \
              --json number,title \
              --jq ".[] | select(.title == \"$issue_title\") | .number" | head -n 1)

            if output=$(python sap/abap/documents/script/check_readme.py "$file" 2>&1); then
              echo "$output"

              if [ -n "$existing_issue" ]; then
                echo "README validation passed. Updating existing Issue #$existing_issue"

                issue_body=$(gh issue view "$existing_issue" \
                  --repo "$GH_REPO" \
                  --json body \
                  --jq '.body')

                issue_body=$(printf '%s\n' "$issue_body" | \
                  sed -E 's#^- \[ \] 修正 `([^`]+)` 中导致检查失败的内容。$#- [x] 修正 [`\1`](https://github.com/'"$GH_REPO"'/blob/main/\1) 中导致检查失败的内容。#' | \
                  sed -E 's#^- \[ \] (.*) 通过 `sap\/abap\/documents\/script\/check_readme\.py` 检查。$#- [x] \1 通过 `sap/abap/documents/script/check_readme.py` 检查。#')

                gh issue edit "$existing_issue" \
                  --repo "$GH_REPO" \
                  --body "$issue_body"

                gh label create review \
                  --repo "$GH_REPO" \
                  --force

                gh issue edit "$existing_issue" \
                  --repo "$GH_REPO" \
                  --add-label review
              fi

              continue
            fi

            validation_failed=1
            echo "$output"

            errors=$(printf '%s\n' "$output" | grep -F '❌ FAIL' || true)
            if [ -z "$errors" ]; then
              errors="- ❌ FAIL: README 验证失败，请查看完整日志。"
            fi

            file_link="https://github.com/$GH_REPO/blob/main/$file"
            issue_body=$(printf '## 任务\n修正 [%s](%s) 的 README 格式，使其通过 README 自动检查。\n\n## 要求\n### 自动检查失败信息：\n\n%s\n\n## 验收条件\n- [ ] 修正 [%s](%s) 中导致检查失败的内容。\n- [ ] [%s](%s) 通过 `sap/abap/documents/script/check_readme.py` 检查。\n' "$file" "$file_link" "$errors" "$file" "$file_link" "$file" "$file_link")

            if [ -n "$existing_issue" ]; then
              echo "Updating existing Issue #$existing_issue"
              gh issue edit "$existing_issue" --repo "$GH_REPO" --body "$issue_body"
            else
              echo "Creating Issue: $issue_title"
              gh issue create --repo "$GH_REPO" --title "$issue_title" --body "$issue_body"
            fi
          done < changed_readmes.txt

          if [ "$validation_failed" -ne 0 ]; then
            exit 1
          fi
